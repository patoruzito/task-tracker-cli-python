[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tracker-cli"
version = "0.1.0"
description = "A Python CLI to track tasks, with atomic JSON persistence and zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Leonardo Lopez Oroño" }]
dependencies = []

[project.scripts]
task-cli = "task_tracker.cli:main"